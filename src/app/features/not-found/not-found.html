<div class="not-found-page">
  <mat-card class="not-found-card">
    <mat-card-header>
      <mat-card-title>Página não encontrada</mat-card-title>
      <mat-card-subtitle>Erro 404</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        O endereço acessado não existe ou foi movido. Verifique a URL ou volte
        para uma área conhecida do sistema.
      </p>
    </mat-card-content>
    <mat-card-actions align="end">
      @if (isAuthenticated()) {
        <a mat-flat-button color="primary" routerLink="/home">Ir para Home</a>
      } @else {
        <a mat-flat-button color="primary" routerLink="/login">Ir para Login</a>
      }
    </mat-card-actions>
  </mat-card>
</div>
