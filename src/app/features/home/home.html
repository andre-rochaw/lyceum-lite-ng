@if (user(); as u) {
  <div class="home-page">
    <header class="home-hero">
      <p class="home-eyebrow">Lyceum Lite</p>
      <h1 class="hero-title">Olá, {{ u.name }}</h1>
      <p class="home-lead">
        Gerencie o ciclo acadêmico de alunos, cursos, disciplinas, turmas e matrículas.
      </p>
    </header>

    <mat-card class="home-card">
      <mat-card-header>
        <mat-card-title class="section-title">Sua sessão</mat-card-title>
      </mat-card-header>
      <mat-card-content class="home-card__content">
        <dl class="home-meta">
          <div>
            <dt>Nome</dt>
            <dd>{{ u.name }}</dd>
          </div>
          <div>
            <dt>E-mail</dt>
            <dd>{{ u.email }}</dd>
          </div>
          <div>
            <dt>Cargo</dt>
            <dd>{{ u.role }}</dd>
          </div>
          <div>
            <dt>Último login</dt>
            <dd>{{ u.lastLogin ? (u.lastLogin | date: 'short') : '—' }}</dd>
          </div>
        </dl>
      </mat-card-content>
    </mat-card>
  </div>
}
